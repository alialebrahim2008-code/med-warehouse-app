name: Deploy medication warehouse app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and verify V16 static site
        run: |
          set -euo pipefail
          mkdir -p dist
          cat \
            site-v16.part01 \
            site-v16.part02 \
            site-v16.part03 \
            site-v16.part04_00 site-v16.part04_01 site-v16.part04_02 \
            site-v16.part05_00 site-v16.part05_01 site-v16.part05_02 \
            site-v16.part06_00 site-v16.part06_01 site-v16.part06_02 \
            | base64 -d | gunzip > dist/index.html
          test "$(wc -c < dist/index.html)" -eq 97428
          test "$(sha256sum dist/index.html | awk '{print $1}')" = "60b719a639f40f48c9b4e1731c1dc7216d57547f169021ed8813e3113db479ce"
          grep -q 'V16' dist/index.html
          grep -q 'startLiveBarcodeBtn' dist/index.html
          grep -q 'parseGs1ElementString' dist/index.html
          grep -q 'normalizeImageForOcr' dist/index.html
          grep -q "Tesseract.recognize(normalized,'eng+ara'" dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
