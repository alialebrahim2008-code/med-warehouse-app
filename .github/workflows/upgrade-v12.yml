name: Upgrade medication warehouse app to V12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v12.yml'
      - '.github/v11_to_v12.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply V12 patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'V12 — استلام العبوة' index.html; then
            echo 'V12 already applied.'
            exit 0
          fi
          git apply --check .github/v11_to_v12.patch
          git apply .github/v11_to_v12.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Upgrade medication warehouse app to V12'
          git push origin main
